plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

android {
    namespace 'com.example.ds04_monash_rideshare_application'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.ds04_monash_rideshare_application"
        minSdk 26 // Yandex MapKit requires 26+
        targetSdk 34
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "YANDEX_MAPKIT_API_KEY", "\"${localProperties.getProperty('YANDEX_MAPKIT_API_KEY', '')}\""
        // 10.0.2.2 is the Android emulator's alias for the host machine's localhost, where
        // `./gradlew :backend:run` listens. Override in local.properties for a physical device
        // or a hosted backend once the team picks one (docs/BACKEND.md).
        buildConfigField "String", "BACKEND_BASE_URL", "\"${localProperties.getProperty('BACKEND_BASE_URL', 'http://10.0.2.2:8080/')}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = "11"
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    implementation libs.retrofit.core
    implementation libs.retrofit.converter.gson
    implementation libs.okhttp.logging.interceptor
    implementation libs.yandex.mapkit
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.activity.compose
    implementation libs.androidx.navigation.compose
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.core.ktx
    implementation libs.androidx.graphics.path
    implementation libs.androidx.lifecycle.runtime.ktx
    testImplementation libs.junit
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.junit
    debugImplementation libs.androidx.compose.ui.test.manifest
    debugImplementation libs.androidx.compose.ui.tooling
    implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
}
