// Trial backend for the rideshare app (see docs/RTM.md FR-08: "Central DB technology not yet
// chosen in-repo"). Kotlin/Ktor + Exposed + SQLite so it runs locally with no external service —
// `./gradlew :backend:run` — while the team decides on real hosting. Swap SQLite for a hosted
// Postgres by changing only Database.kt once that decision is made.
plugins {
    alias(libs.plugins.kotlin.jvm)
    alias(libs.plugins.kotlin.serialization)
    id 'application'
}

group = 'com.example.ds04_monash_rideshare_application.backend'
version = '0.1.0'

// Repositories are centralised in settings.gradle (dependencyResolutionManagement, which already
// includes mavenCentral()) - don't declare a repositories {} block here, it's disallowed.

def ktorVersion = '2.3.12'
def exposedVersion = '0.49.0'

dependencies {
    implementation "io.ktor:ktor-server-core-jvm:$ktorVersion"
    implementation "io.ktor:ktor-server-netty-jvm:$ktorVersion"
    implementation "io.ktor:ktor-server-content-negotiation-jvm:$ktorVersion"
    implementation "io.ktor:ktor-serialization-kotlinx-json-jvm:$ktorVersion"
    implementation "io.ktor:ktor-server-status-pages-jvm:$ktorVersion"
    implementation "io.ktor:ktor-server-call-logging-jvm:$ktorVersion"
    implementation "io.ktor:ktor-server-cors-jvm:$ktorVersion"

    implementation "org.jetbrains.exposed:exposed-core:$exposedVersion"
    implementation "org.jetbrains.exposed:exposed-dao:$exposedVersion"
    implementation "org.jetbrains.exposed:exposed-jdbc:$exposedVersion"

    implementation 'org.xerial:sqlite-jdbc:3.46.1.0'
    implementation 'ch.qos.logback:logback-classic:1.5.6'

    testImplementation "io.ktor:ktor-server-test-host-jvm:$ktorVersion"
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit5:${libs.versions.kotlin.get()}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.11.0"
}

kotlin {
    jvmToolchain(17)
}

application {
    mainClass = 'com.example.ds04_monash_rideshare_application.backend.ApplicationKt'
}

// Forgotten-password reset for whoever runs the backend (no email sending yet):
//   ./gradlew :backend:resetPassword --args="someone@student.monash.edu"
tasks.register('resetPassword', JavaExec) {
    group = 'application'
    description = 'Sets a temporary password for an account and prints it.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.ds04_monash_rideshare_application.backend.ResetPasswordToolKt'
    // Same working directory as :backend:run, so it opens the same rideshare-backend.db.
    workingDir = projectDir
}

// Explicit, operator-run SYNTHETIC demo history for one existing account (see
// DemoHistorySeeder.kt). Idempotent; --remove deletes only the demo records again:
//   ./gradlew :backend:seedDemoHistory --args="someone@student.monash.edu"
//   ./gradlew :backend:seedDemoHistory --args="someone@student.monash.edu --remove"
tasks.register('seedDemoHistory', JavaExec) {
    group = 'application'
    description = 'Seeds (or with --remove, removes) synthetic completed-ride history for one account.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.ds04_monash_rideshare_application.backend.SeedDemoHistoryTool'
    workingDir = projectDir
}

// PRODUCTION travel-time matrix: one request to a local OSRM server (OpenStreetMap data) for the whole
// 30 x 30 table, through the same strict importer. tools/osrm/generate-travel-times.ps1 runs the full
// procedure including OSRM itself; see docs/TRAVEL_TIMES.md:
//   ./gradlew :backend:generateTravelTimes --args="--osrm http://localhost:5000 --provenance path/provenance.json"
tasks.register('generateTravelTimes', JavaExec) {
    group = 'application'
    description = 'Generates backend/src/main/resources/travel-times.json from a local OSRM Table request.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.ds04_monash_rideshare_application.backend.GenerateTravelTimesToolKt'
    workingDir = projectDir
}

// Builds src/main/resources/travel-times.json from the Android generator's raw export (see
// docs/TRAVEL_TIMES.md). Refuses partial / failed / incomplete exports and writes nothing in that case:
//   ./gradlew :backend:importTravelTimes --args="C:/path/to/travel-times-raw.json"
tasks.register('importTravelTimes', JavaExec) {
    group = 'application'
    description = 'Converts the Android travel-time export into backend/src/main/resources/travel-times.json.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.ds04_monash_rideshare_application.backend.ImportTravelTimesToolKt'
    workingDir = projectDir
}

test {
    useJUnitPlatform()
    // Lets tests call as a seeded user by sending its userId as the bearer token (see Auth.kt).
    systemProperty 'rideshare.test.trustUserIdTokens', 'true'
}
