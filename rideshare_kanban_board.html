<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monash Rideshare — Team Kanban Board</title>
<style>
  :root {
    --asphalt-0: #14171b;
    --asphalt-1: #1b1f24;
    --asphalt-2: #21262d;
    --asphalt-3: #2a3038;
    --line: #343b44;
    --line-strong: #454e59;
    --lane: #f2c14e;
    --lane-dim: #7a6427;
    --text-hi: #edecea;
    --text-mid: #a9afba;
    --text-low: #6f7683;
    --member-a: #5eb3f6;
    --member-b: #7ee787;
    --member-c: #f2c14e;
    --member-d: #f78166;
    --member-team: #c9a7ff;
    --danger: #f76a6a;
    --ok: #57d38c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--asphalt-0);
    color: var(--text-hi);
    min-height: 100vh;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 22px 22px 60px; }

  header.top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }
  h1 span.route-dot {
    display: inline-block;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--lane);
    margin-right: 9px;
    vertical-align: 1px;
  }
  .sub {
    color: var(--text-mid);
    font-size: 12.5px;
    margin: 4px 0 0;
  }

  .toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .toolbar button, .toolbar select {
    background: var(--asphalt-2);
    border: 1px solid var(--line);
    color: var(--text-hi);
    font-size: 12.5px;
    padding: 7px 11px;
    border-radius: 7px;
    cursor: pointer;
  }
  .toolbar button:hover { border-color: var(--line-strong); }
  .toolbar select { cursor: pointer; }
  .toolbar button.primary {
    background: var(--lane);
    color: #2a2005;
    border-color: var(--lane);
    font-weight: 600;
  }

  .legend {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin: 14px 0 18px;
    padding: 10px 14px;
    background: var(--asphalt-1);
    border: 1px solid var(--line);
    border-radius: 9px;
    font-size: 12px;
    color: var(--text-mid);
  }
  .legend .item { display: flex; align-items: center; gap: 6px; }
  .legend .swatch { width: 9px; height: 9px; border-radius: 2px; }

  .progress-rail {
    display: flex;
    align-items: center;
    margin: 16px 0 20px;
    padding: 0 4px;
  }
  .progress-rail .seg {
    flex: 1;
    height: 3px;
    background: var(--line);
    position: relative;
  }
  .progress-rail .seg.filled { background: var(--lane); }
  .progress-rail .stop {
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--asphalt-2);
    border: 2px solid var(--line-strong);
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }
  .progress-rail .stop.filled { background: var(--lane); border-color: var(--lane); }
  .progress-rail .stop-label {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: var(--text-low);
    white-space: nowrap;
  }
  .progress-rail .stop-wrap { position: relative; display:flex; flex-direction:column; align-items:center; }

  .board {
    display: grid;
    grid-template-columns: repeat(4, minmax(240px, 1fr));
    gap: 16px;
    overflow-x: auto;
    padding-bottom: 10px;
  }
  .col {
    background: var(--asphalt-1);
    border: 1px solid var(--line);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    min-height: 240px;
    max-height: calc(100vh - 240px);
  }
  .col-head {
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 4px;
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--asphalt-1);
    border-radius: 12px 12px 0 0;
  }
  .col-head .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .col-head .name {
    font-size: 13.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-hi);
  }
  .col-head .count {
    font-size: 11.5px;
    color: var(--text-low);
    background: var(--asphalt-3);
    padding: 2px 8px;
    border-radius: 20px;
  }
  .col-head .desc {
    font-size: 10.5px;
    color: var(--text-low);
    line-height: 1.35;
  }
  .col-body {
    flex: 1;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 140px;
    overflow-y: auto;
    transition: background 0.12s;
  }
  .col-body.dragover { background: rgba(242,193,78,0.06); }
  .col[data-col="blocked"] .col-head .name { color: var(--danger); }
  .col[data-col="done"] .col-head .name { color: var(--ok); }

  .card {
    background: var(--asphalt-2);
    border: 1px solid var(--line);
    border-left: 3px solid var(--member-team);
    border-radius: 8px;
    padding: 11px 12px 10px;
    cursor: grab;
    font-size: 13px;
    line-height: 1.45;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  .card:hover { border-color: var(--line-strong); }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: 0.4; }
  .card .title { color: var(--text-hi); margin: 0 0 7px; }
  .card .meta {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .tag {
    font-size: 10px;
    padding: 1.5px 6px;
    border-radius: 4px;
    background: var(--asphalt-3);
    color: var(--text-mid);
    white-space: nowrap;
  }
  .tag.week { color: var(--text-low); }
  .tag.req { color: var(--lane); background: rgba(242,193,78,0.1); }
  .member-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 4px;
  }
  .card .owner-line {
    display: flex;
    align-items: center;
    font-size: 10.5px;
    color: var(--text-mid);
    margin-top: 5px;
  }
  .empty-hint {
    font-size: 11px;
    color: var(--text-low);
    text-align: center;
    padding: 18px 6px;
  }

  .tag.story { color: var(--ok); background: rgba(87,211,140,0.1); }
  .tag.tech { color: var(--text-low); }

  .hidden { display: none !important; }
  footer.note {
    margin-top: 18px;
    font-size: 11.5px;
    color: var(--text-low);
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,12,14,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .modal {
    position: relative;
    background: var(--asphalt-1);
    border: 1px solid var(--line);
    border-radius: 12px;
    width: 100%;
    max-width: 480px;
    max-height: calc(100vh - 60px);
    overflow-y: auto;
    padding: 20px 22px 18px;
  }
  .modal h2 {
    font-size: 15px;
    margin: 0 0 16px;
    padding-right: 24px;
    color: var(--text-hi);
  }
  .modal-x {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    color: var(--text-mid);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    border-radius: 6px;
  }
  .modal-x:hover { background: var(--asphalt-3); color: var(--text-hi); }
  .view-meta {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .owner-line { font-size: 12px; color: var(--text-mid); }
  .view-story-block { margin-top: 16px; }
  .view-story-block label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--text-mid);
    margin-bottom: 6px;
  }
  .view-story-block p {
    margin: 0;
    font-size: 13px;
    line-height: 1.5;
    color: var(--text-hi);
    background: var(--asphalt-2);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 10px 12px;
  }
  .view-story-block p.technical { color: var(--text-low); font-style: italic; }
  .field { margin-bottom: 13px; }
  .field label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--text-mid);
    margin-bottom: 5px;
  }
  .field input[type="text"],
  .field select,
  .field textarea {
    width: 100%;
    background: var(--asphalt-2);
    border: 1px solid var(--line);
    color: var(--text-hi);
    font-size: 13px;
    font-family: inherit;
    padding: 8px 10px;
    border-radius: 7px;
  }
  .field textarea { resize: vertical; min-height: 60px; line-height: 1.4; }
  .field-check {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--text-mid);
    margin-bottom: 8px;
  }
  .modal-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
  }
  .modal-actions .right { display: flex; gap: 8px; }
  .modal-actions button {
    background: var(--asphalt-2);
    border: 1px solid var(--line);
    color: var(--text-hi);
    font-size: 12.5px;
    padding: 7px 12px;
    border-radius: 7px;
    cursor: pointer;
  }
  .modal-actions button:hover { border-color: var(--line-strong); }
  .modal-actions button.primary {
    background: var(--lane);
    color: #2a2005;
    border-color: var(--lane);
    font-weight: 600;
  }
  .modal-actions button.danger {
    background: transparent;
    color: var(--danger);
    border-color: var(--danger);
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1><span class="route-dot"></span>Monash Rideshare — Team Kanban Board</h1>
      <p class="sub">Shared team board — drag cards between stations, or click a card to view/edit it. Changes are visible to everyone with this file.</p>
    </div>
    <div class="toolbar">
      <select id="memberFilter">
        <option value="all">All members</option>
        <option value="team">Team</option>
        <option value="a">Member A — Android/UI</option>
        <option value="b">Member B — Backend/DB</option>
        <option value="c">Member C — Integration</option>
        <option value="d">Member D — QA/Security</option>
      </select>
      <select id="weekFilter">
        <option value="all">All weeks</option>
      </select>
      <button id="resetBtn">Reset board</button>
      <button id="addBtn" class="primary">+ Add ticket</button>
    </div>
  </header>

  <div class="legend">
    <span class="item"><span class="swatch" style="background:var(--member-team)"></span>Team</span>
    <span class="item"><span class="swatch" style="background:var(--member-a)"></span>Member A · Android/UI</span>
    <span class="item"><span class="swatch" style="background:var(--member-b)"></span>Member B · Backend/DB</span>
    <span class="item"><span class="swatch" style="background:var(--member-c)"></span>Member C · Integration</span>
    <span class="item"><span class="swatch" style="background:var(--member-d)"></span>Member D · QA/Security</span>
  </div>

  <div class="board" id="board"></div>

  <footer class="note" id="statusLine"></footer>
</div>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal">
    <button type="button" class="modal-x" id="modalClose" aria-label="Close">&times;</button>

    <div id="viewPane">
      <h2 id="vTitle"></h2>
      <div class="view-meta">
        <span class="tag" id="vColumn"></span>
        <span class="tag week" id="vWeek"></span>
        <span class="tag req hidden" id="vReq"></span>
      </div>
      <div class="owner-line" id="vOwnerLine" style="margin-top:10px;"></div>
      <div class="view-story-block">
        <label>User story</label>
        <p id="vStory"></p>
      </div>
      <div class="modal-actions">
        <button id="viewDelete" class="danger">Delete</button>
        <div class="right">
          <button id="viewEdit" class="primary">Edit</button>
        </div>
      </div>
    </div>

    <div id="editPane" class="hidden">
      <h2 id="modalTitle">Ticket</h2>
      <div class="field">
        <label for="fTitle">Title</label>
        <input type="text" id="fTitle" maxlength="200">
      </div>
      <div class="field">
        <label for="fColumn">Backlog / status</label>
        <select id="fColumn"></select>
      </div>
      <div class="field">
        <label for="fWeek">Week</label>
        <input type="text" id="fWeek" placeholder="e.g. Week 3">
      </div>
      <div class="field">
        <label for="fOwner">Owner</label>
        <select id="fOwner">
          <option value="team">Team</option>
          <option value="a">Member A — Android/UI</option>
          <option value="b">Member B — Backend/DB</option>
          <option value="c">Member C — Integration</option>
          <option value="d">Member D — QA/Security</option>
        </select>
      </div>
      <div class="field">
        <label for="fReq">Requirement ID (optional)</label>
        <input type="text" id="fReq" placeholder="e.g. FR-04">
      </div>
      <div class="field">
        <label class="field-check"><input type="checkbox" id="fTechnical"> Technical task (no user story)</label>
        <label for="fStory">User story</label>
        <textarea id="fStory" placeholder="As a [role], I want [goal], so that [benefit]."></textarea>
      </div>
      <div class="modal-actions">
        <div></div>
        <div class="right">
          <button id="modalCancel">Cancel</button>
          <button id="modalSave" class="primary">Save</button>
        </div>
      </div>
    </div>
  </div>
</div>

let state = null;
let storageOk = true;

async function saveState() {
  if (!boardRef) {
    storageOk = false;
    updateStatusLine();
    return;
  }
  try {
    await set(boardRef, state);
    storageOk = true;
  } catch (e) {
    storageOk = false;
  }
  updateStatusLine();
}

function updateStatusLine() {
  const el = document.getElementById("statusLine");
  if (!FIREBASE_CONFIGURED) {
    el.textContent = "Firebase isn't set up yet — edit FIREBASE_CONFIG near the top of this file's <script> so the board syncs live for everyone. Right now changes only live in this browser tab.";
  } else {
    el.textContent = storageOk
      ? "Shared team board — connected. Changes sync live for everyone with this file."
      : "Lost connection to Firebase — edits may not save until it reconnects.";
  }
}

function populateWeekFilter() {
  const weeks = [...new Set(state.tasks.map(t => t.week))].sort();
  const sel = document.getElementById("weekFilter");
  weeks.forEach(w => {
    const opt = document.createElement("option");
    opt.value = w;
    opt.textContent = w;
    sel.appendChild(opt);
  });
}

function renderRail() {
  const doneCount = state.tasks.filter(t => t.col === "done").length;
  const total = state.tasks.length;
}

function render() {
  const memberVal = document.getElementById("memberFilter").value;
  const weekVal = document.getElementById("weekFilter").value;
  const board = document.getElementById("board");
  // Keeps the grid in sync with however many columns actually exist, rather than a number
  // baked into the CSS - the CSS had drifted out of sync with COLUMNS once before (7 columns
  // reserved in the grid for what had become a 4-column board), squeezing everything into the
  // first slots and leaving dead space on the right.
  board.style.gridTemplateColumns = `repeat(${COLUMNS.length}, minmax(240px, 1fr))`;
  board.innerHTML = "";

  COLUMNS.forEach(col => {
    const colEl = document.createElement("div");
    colEl.className = "col";
    colEl.dataset.col = col.id;

    const tasksHere = state.tasks.filter(t => {
      if (t.col !== col.id) return false;
      if (memberVal !== "all" && t.owner !== memberVal) return false;
      if (weekVal !== "all" && t.week !== weekVal) return false;
      return true;
    });

    colEl.innerHTML = `
      <div class="col-head">
        <div class="row">
          <span class="name">${col.name}</span>
          <span class="count">${tasksHere.length}</span>
        </div>
        ${col.desc ? `<div class="desc">${escapeHtml(col.desc)}</div>` : ""}
      </div>
      <div class="col-body" data-col="${col.id}"></div>
    `;
    board.appendChild(colEl);

    const body = colEl.querySelector(".col-body");
    if (tasksHere.length === 0) {
      body.innerHTML = '<div class="empty-hint">No tickets here</div>';
    } else {
      tasksHere.forEach(t => body.appendChild(renderCard(t)));
    }

    body.addEventListener("dragover", e => {
      e.preventDefault();
      body.classList.add("dragover");
    });
    body.addEventListener("dragleave", () => body.classList.remove("dragover"));
    body.addEventListener("drop", async e => {
      e.preventDefault();
      body.classList.remove("dragover");
      const id = e.dataTransfer.getData("text/plain");
      const task = state.tasks.find(t => t.id === id);
      if (task) {
        task.col = col.id;
        await saveState();
        render();
      }
    });
  });
}

function renderCard(t) {
  const card = document.createElement("div");
  card.className = "card";
  card.draggable = true;
  card.dataset.id = t.id;
  const m = MEMBER_INFO[t.owner] || MEMBER_INFO.team;
  card.style.borderLeftColor = m.color;
  card.innerHTML = `
    <p class="title">${escapeHtml(t.title)}</p>
    <div class="meta">
      <span class="tag week">${escapeHtml(t.week)}</span>
      ${t.req ? `<span class="tag req">${escapeHtml(t.req)}</span>` : ""}
      ${t.story ? `<span class="tag story">Story</span>` : `<span class="tag tech">Technical</span>`}
    </div>
    <div class="owner-line"><span class="member-dot" style="background:${m.color}"></span>${m.label}</div>
  `;
  card.addEventListener("dragstart", e => {
    e.dataTransfer.setData("text/plain", t.id);
    card.classList.add("dragging");
  });
  card.addEventListener("dragend", () => card.classList.remove("dragging"));
  card.addEventListener("click", () => openTicketModal(t.id));
  return card;
}

// --- Ticket modal (view/edit/create) -----------------------------------

let editingId = null; // null while creating a brand-new ticket

function populateColumnSelect() {
  const sel = document.getElementById("fColumn");
  sel.innerHTML = "";
  COLUMNS.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c.id;
    opt.textContent = c.name;
    sel.appendChild(opt);
  });
}

function columnName(id) {
  const c = COLUMNS.find(c => c.id === id);
  return c ? c.name : id;
}

function openTicketModal(id) {
  editingId = id || null;
  const task = id ? state.tasks.find(t => t.id === id) : null;

  document.getElementById("modalOverlay").classList.remove("hidden");
  if (task) {
    showViewPane(task);
  } else {
    showEditPane(null);
  }
}

function showViewPane(task) {
  const m = MEMBER_INFO[task.owner] || MEMBER_INFO.team;
  document.getElementById("vTitle").textContent = task.title;
  document.getElementById("vColumn").textContent = columnName(task.col);
  document.getElementById("vWeek").textContent = task.week;
  const vReq = document.getElementById("vReq");
  vReq.textContent = task.req;
  vReq.classList.toggle("hidden", !task.req);
  document.getElementById("vOwnerLine").innerHTML =
    `<span class="member-dot" style="background:${m.color}"></span>${m.label}`;
  const vStory = document.getElementById("vStory");
  if (task.story) {
    vStory.textContent = task.story;
    vStory.classList.remove("technical");
  } else {
    vStory.textContent = "Technical task — no user story applies.";
    vStory.classList.add("technical");
  }

  document.getElementById("viewPane").classList.remove("hidden");
  document.getElementById("editPane").classList.add("hidden");
}

function showEditPane(task) {
  document.getElementById("modalTitle").textContent = task ? "Edit ticket" : "New ticket";
  document.getElementById("fTitle").value = task ? task.title : "";
  populateColumnSelect();
  document.getElementById("fColumn").value = task ? task.col : "product";
  document.getElementById("fWeek").value = task ? task.week : "";
  document.getElementById("fOwner").value = task ? task.owner : "team";
  document.getElementById("fReq").value = task ? task.req : "";
  document.getElementById("fTechnical").checked = task ? !task.story : false;
  document.getElementById("fStory").value = task ? task.story : "";
  document.getElementById("fStory").disabled = document.getElementById("fTechnical").checked;

  document.getElementById("viewPane").classList.add("hidden");
  document.getElementById("editPane").classList.remove("hidden");
  document.getElementById("fTitle").focus();
}

function closeTicketModal() {
  document.getElementById("modalOverlay").classList.add("hidden");
  editingId = null;
}

document.getElementById("fTechnical").addEventListener("change", e => {
  document.getElementById("fStory").disabled = e.target.checked;
  if (e.target.checked) document.getElementById("fStory").value = "";
});

document.getElementById("modalClose").addEventListener("click", closeTicketModal);
document.getElementById("modalOverlay").addEventListener("click", e => {
  if (e.target.id === "modalOverlay") closeTicketModal();
});

document.getElementById("viewEdit").addEventListener("click", () => {
  const task = state.tasks.find(t => t.id === editingId);
  showEditPane(task);
});

document.getElementById("viewDelete").addEventListener("click", async () => {
  if (!editingId) return;
  if (!confirm("Delete this ticket for everyone on the team?")) return;
  state.tasks = state.tasks.filter(t => t.id !== editingId);
  await saveState();
  closeTicketModal();
  render();
});

document.getElementById("modalCancel").addEventListener("click", () => {
  const task = editingId ? state.tasks.find(t => t.id === editingId) : null;
  if (task) {
    showViewPane(task);
  } else {
    closeTicketModal();
  }
});

document.getElementById("modalSave").addEventListener("click", async () => {
  const title = document.getElementById("fTitle").value.trim();
  if (!title) { document.getElementById("fTitle").focus(); return; }
  const col = document.getElementById("fColumn").value;
  const week = document.getElementById("fWeek").value.trim() || "Week 1";
  const owner = document.getElementById("fOwner").value;
  const req = document.getElementById("fReq").value.trim();
  const technical = document.getElementById("fTechnical").checked;
  const story = technical ? "" : document.getElementById("fStory").value.trim();

  let task;
  if (editingId) {
    task = state.tasks.find(t => t.id === editingId);
    Object.assign(task, { title, col, week, owner, req, story });
  } else {
    task = { id: "t" + Date.now(), title, col, week, owner, req, story };
    state.tasks.push(task);
    editingId = task.id;
  }
  await saveState();
  render();
  showViewPane(task);
});

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

document.getElementById("memberFilter").addEventListener("change", render);
document.getElementById("weekFilter").addEventListener("change", render);

document.getElementById("resetBtn").addEventListener("click", async () => {
  if (!confirm("This resets the board for everyone on the team, not just you. Continue?")) return;
  state = { tasks: DEFAULT_TASKS.map(t => ({...t})) };
  await saveState();
  render();
});

document.getElementById("addBtn").addEventListener("click", () => openTicketModal(null));

function init() {
  if (!boardRef) {
    state = { tasks: DEFAULT_TASKS.map(t => ({...t})) };
    populateWeekFilter();
    updateStatusLine();
    render();
    return;
  }

  onValue(boardRef, snapshot => {
    const val = snapshot.val();
    const firstLoad = state === null;
    if (val && val.tasks) {
      state = val;
      // Older saves used a single "backlog" column; the board now splits it into
      // Product Backlog / Sprint Backlog, so remap any leftover legacy value so
      // those tickets don't silently disappear from every column.
      const defaultsById = new Map(DEFAULT_TASKS.map(d => [d.id, d]));
      let migrated = false;
      state.tasks.forEach(t => {
        if (t.col === "backlog") { t.col = "product"; migrated = true; }
        if (t.story === undefined) {
          // Backfill from the shipped ticket data when this saved ticket predates
          // the story field, instead of blanking every pre-existing ticket to "Technical".
          const d = defaultsById.get(t.id);
          t.story = d ? d.story : "";
          migrated = true;
        }
      });
      if (migrated) saveState();
    } else {
      state = { tasks: DEFAULT_TASKS.map(t => ({...t})) };
      set(boardRef, state);
    }
    storageOk = true;
    if (firstLoad) populateWeekFilter();
    updateStatusLine();
    render();
  }, () => {
    storageOk = false;
    updateStatusLine();
  });
}

init();
</script>
