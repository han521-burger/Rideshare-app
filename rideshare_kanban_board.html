<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monash Rideshare — Team Kanban Board</title>
<style>
  :root {
    --asphalt-0: #14171b;
    --asphalt-1: #1b1f24;
    --asphalt-2: #21262d;
    --asphalt-3: #2a3038;
    --line: #343b44;
    --line-strong: #454e59;
    --lane: #f2c14e;
    --lane-dim: #7a6427;
    --text-hi: #edecea;
    --text-mid: #a9afba;
    --text-low: #6f7683;
    --member-a: #5eb3f6;
    --member-b: #7ee787;
    --member-c: #f2c14e;
    --member-d: #f78166;
    --member-team: #c9a7ff;
    --danger: #f76a6a;
    --ok: #57d38c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--asphalt-0);
    color: var(--text-hi);
    min-height: 100vh;
  }
  .wrap { max-width: 1500px; margin: 0 auto; padding: 22px 22px 60px; }

  header.top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }
  h1 span.route-dot {
    display: inline-block;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--lane);
    margin-right: 9px;
    vertical-align: 1px;
  }
  .sub {
    color: var(--text-mid);
    font-size: 12.5px;
    margin: 4px 0 0;
  }

  .toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .toolbar button, .toolbar select {
    background: var(--asphalt-2);
    border: 1px solid var(--line);
    color: var(--text-hi);
    font-size: 12.5px;
    padding: 7px 11px;
    border-radius: 7px;
    cursor: pointer;
  }
  .toolbar button:hover { border-color: var(--line-strong); }
  .toolbar select { cursor: pointer; }
  .toolbar button.primary {
    background: var(--lane);
    color: #2a2005;
    border-color: var(--lane);
    font-weight: 600;
  }

  .legend {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin: 14px 0 18px;
    padding: 10px 14px;
    background: var(--asphalt-1);
    border: 1px solid var(--line);
    border-radius: 9px;
    font-size: 12px;
    color: var(--text-mid);
  }
  .legend .item { display: flex; align-items: center; gap: 6px; }
  .legend .swatch { width: 9px; height: 9px; border-radius: 2px; }

  .progress-rail {
    display: flex;
    align-items: center;
    margin: 16px 0 20px;
    padding: 0 4px;
  }
  .progress-rail .seg {
    flex: 1;
    height: 3px;
    background: var(--line);
    position: relative;
  }
  .progress-rail .seg.filled { background: var(--lane); }
  .progress-rail .stop {
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--asphalt-2);
    border: 2px solid var(--line-strong);
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }
  .progress-rail .stop.filled { background: var(--lane); border-color: var(--lane); }
  .progress-rail .stop-label {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: var(--text-low);
    white-space: nowrap;
  }
  .progress-rail .stop-wrap { position: relative; display:flex; flex-direction:column; align-items:center; }

  .board {
    display: grid;
    grid-template-columns: repeat(7, minmax(220px, 1fr));
    gap: 12px;
    overflow-x: auto;
    padding-bottom: 10px;
  }
  .col {
    background: var(--asphalt-1);
    border: 1px solid var(--line);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    min-height: 200px;
  }
  .col-head {
    padding: 11px 12px 9px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .col-head .name {
    font-size: 12.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-hi);
  }
  .col-head .count {
    font-size: 11px;
    color: var(--text-low);
    background: var(--asphalt-3);
    padding: 1px 7px;
    border-radius: 20px;
  }
  .col-body {
    flex: 1;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 120px;
    transition: background 0.12s;
  }
  .col-body.dragover { background: rgba(242,193,78,0.06); }
  .col[data-col="blocked"] .col-head .name { color: var(--danger); }
  .col[data-col="done"] .col-head .name { color: var(--ok); }

  .card {
    background: var(--asphalt-2);
    border: 1px solid var(--line);
    border-left: 3px solid var(--member-team);
    border-radius: 7px;
    padding: 9px 10px 8px;
    cursor: grab;
    font-size: 12.5px;
    line-height: 1.4;
  }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: 0.4; }
  .card .title { color: var(--text-hi); margin: 0 0 6px; }
  .card .meta {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .tag {
    font-size: 10px;
    padding: 1.5px 6px;
    border-radius: 4px;
    background: var(--asphalt-3);
    color: var(--text-mid);
    white-space: nowrap;
  }
  .tag.week { color: var(--text-low); }
  .tag.req { color: var(--lane); background: rgba(242,193,78,0.1); }
  .member-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 4px;
  }
  .card .owner-line {
    display: flex;
    align-items: center;
    font-size: 10.5px;
    color: var(--text-mid);
    margin-top: 5px;
  }
  .empty-hint {
    font-size: 11px;
    color: var(--text-low);
    text-align: center;
    padding: 18px 6px;
  }

  .hidden { display: none !important; }
  footer.note {
    margin-top: 18px;
    font-size: 11.5px;
    color: var(--text-low);
  }
</style>
</head>
<body>

      <h1><span class="route-dot"></span>Monash Rideshare — Team Build Board</h1>
      <p class="sub">Shared team board — drag cards between stations as work moves. Changes are visible to everyone with this file.</p>
    </div>
    <div class="toolbar">
      <select id="memberFilter">
        <option value="all">All members</option>

        <option value="all">All weeks</option>
      </select>
      <button id="resetBtn">Reset board</button>
      <button id="addBtn" class="primary">+ Add ticket</button>
    </div>
  </header>

  <div class="legend">
    <span class="item"><span class="swatch" style="background:var(--member-team)"></span>Team</span>

let state = null;
let storageOk = true;

async function saveState() {
  if (!boardRef) {
    storageOk = false;
    updateStatusLine();
    return;
  }
  try {
    await set(boardRef, state);
    storageOk = true;
  } catch (e) {
    storageOk = false;
  }
  updateStatusLine();
}

function updateStatusLine() {
  const el = document.getElementById("statusLine");
  if (!FIREBASE_CONFIGURED) {
    el.textContent = "Firebase isn't set up yet — edit FIREBASE_CONFIG near the top of this file's <script> so the board syncs live for everyone. Right now changes only live in this browser tab.";
  } else {
    el.textContent = storageOk
      ? "Shared team board — connected. Changes sync live for everyone with this file."
      : "Lost connection to Firebase — edits may not save until it reconnects.";
  }
}

function populateWeekFilter() {
  const weeks = [...new Set(state.tasks.map(t => t.week))].sort();
  const sel = document.getElementById("weekFilter");
  weeks.forEach(w => {
    const opt = document.createElement("option");
    opt.value = w;
    opt.textContent = w;
    sel.appendChild(opt);
  });
}

function renderRail() {
  const doneCount = state.tasks.filter(t => t.col === "done").length;
  const total = state.tasks.length;
}

function render() {
  const memberVal = document.getElementById("memberFilter").value;
  const weekVal = document.getElementById("weekFilter").value;
  const board = document.getElementById("board");
  board.innerHTML = "";

  COLUMNS.forEach(col => {
    const colEl = document.createElement("div");
    colEl.className = "col";
    colEl.dataset.col = col.id;

    const tasksHere = state.tasks.filter(t => {
      if (t.col !== col.id) return false;
      if (memberVal !== "all" && t.owner !== memberVal) return false;
      if (weekVal !== "all" && t.week !== weekVal) return false;
      return true;
    });

    colEl.innerHTML = `
      <div class="col-head">
        <span class="name">${col.name}</span>
        <span class="count">${tasksHere.length}</span>
      </div>
      <div class="col-body" data-col="${col.id}"></div>
    `;
    board.appendChild(colEl);

    const body = colEl.querySelector(".col-body");
    if (tasksHere.length === 0) {
      body.innerHTML = '<div class="empty-hint">No tickets here</div>';
    } else {
      tasksHere.forEach(t => body.appendChild(renderCard(t)));
    }

    body.addEventListener("dragover", e => {
      e.preventDefault();
      body.classList.add("dragover");
    });
    body.addEventListener("dragleave", () => body.classList.remove("dragover"));
    body.addEventListener("drop", async e => {
      e.preventDefault();
      body.classList.remove("dragover");
      const id = e.dataTransfer.getData("text/plain");
      const task = state.tasks.find(t => t.id === id);
      if (task) {
        task.col = col.id;
        await saveState();
        render();
      }
    });
  });
}

function renderCard(t) {
  const card = document.createElement("div");
  card.className = "card";
  card.draggable = true;
  card.dataset.id = t.id;
  const m = MEMBER_INFO[t.owner] || MEMBER_INFO.team;
  card.style.borderLeftColor = m.color;
  card.innerHTML = `
    <p class="title">${escapeHtml(t.title)}</p>
    <div class="meta">
      <span class="tag week">${escapeHtml(t.week)}</span>
      ${t.req ? `<span class="tag req">${escapeHtml(t.req)}</span>` : ""}
    </div>
    <div class="owner-line"><span class="member-dot" style="background:${m.color}"></span>${m.label}</div>
  `;
  card.addEventListener("dragstart", e => {
    e.dataTransfer.setData("text/plain", t.id);
    card.classList.add("dragging");
  });
  card.addEventListener("dragend", () => card.classList.remove("dragging"));
  return card;
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

document.getElementById("memberFilter").addEventListener("change", render);
document.getElementById("weekFilter").addEventListener("change", render);

document.getElementById("resetBtn").addEventListener("click", async () => {
  if (!confirm("This resets the board for everyone on the team, not just you. Continue?")) return;
  state = { tasks: DEFAULT_TASKS.map(t => ({...t})) };
  await saveState();
  render();
});

document.getElementById("addBtn").addEventListener("click", async () => {
  const title = prompt("Ticket title:");
  if (!title || !title.trim()) return;
  const week = prompt("Week label (e.g. Week 3):", "Week 1") || "Week 1";
  const owner = (prompt("Owner: team / a / b / c / d", "team") || "team").trim().toLowerCase();
  const req = prompt("Requirement ID (optional, e.g. FR-04):", "") || "";
  const id = "t" + Date.now();
  state.tasks.push({
    id, title: title.trim(), week: week.trim(),
    owner: MEMBER_INFO[owner] ? owner : "team",
    req: req.trim(), col: "backlog"
  });
  await saveState();
  render();
});

function init() {
  if (!boardRef) {
    state = { tasks: DEFAULT_TASKS.map(t => ({...t})) };
    populateWeekFilter();
    updateStatusLine();
    render();
    return;
  }

  onValue(boardRef, snapshot => {
    const val = snapshot.val();
    const firstLoad = state === null;
    if (val && val.tasks) {
      state = val;
    } else {
      state = { tasks: DEFAULT_TASKS.map(t => ({...t})) };
      set(boardRef, state);
    }
    storageOk = true;
    if (firstLoad) populateWeekFilter();
    updateStatusLine();
    render();
  }, () => {
    storageOk = false;
    updateStatusLine();
  });
}

init();
</script>
</body>
</html>
